# Capabilities: AI y Agentes Autonomos
# Agregar a CLAUDE.md para que Claude active estos skills segun necesidad

skills:
  agentic-engineering:
    nombre: "Agentic Engineering"
    categoria: "AI/Agentes"
    capabilities:
      - Ingenieria agentica con eval-first execution
      - Descomposicion de tareas complejas
      - Model routing por costo y complejidad
    activar_cuando:
      - "Se disenan sistemas agenticos"
      - "Se implementa eval-first development"
    requiere_confirmacion: true

  ai-first-engineering:
    nombre: "AI-First Engineering"
    categoria: "AI/Agentes"
    capabilities:
      - Modelo operativo AI-first para equipos
      - Estrategias donde AI genera gran parte del codigo
      - Workflows de revision y supervision
    activar_cuando:
      - "Se establece modelo de trabajo AI-first"
      - "Se disenan procesos de equipo con AI"
    requiere_confirmacion: true

  autonomous-loops:
    nombre: "Autonomous Loops (deprecated)"
    categoria: "AI/Agentes"
    capabilities:
      - Pipelines secuenciales con claude -p
      - Loops autonomos multi-agente
      - Patron RFC-driven DAG
    nota: "Deprecado - usar continuous-agent-loop"
    activar_cuando:
      - "Se disenan loops autonomos"
    requiere_confirmacion: true

  continuous-agent-loop:
    nombre: "Continuous Agent Loop"
    categoria: "AI/Agentes"
    capabilities:
      - Loops autonomos continuos
      - Quality gates y evaluaciones
      - Controles de recovery
      - Patrones de resiliencia
    activar_cuando:
      - "Se implementa loop continuo de agente"
      - "Se necesitan quality gates en loops"
    requiere_confirmacion: true

  karpathy:
    nombre: "Karpathy Research Loop"
    categoria: "AI/Agentes"
    trigger: "/karpathy"
    capabilities:
      - Loop de investigacion autonomo con 4 agentes
      - Agentes Researcher, Executor, Analyst, Lead
      - Optimizacion continua de metricas
      - Dominios ML, web performance, ads, code quality
      - Templates por dominio
    activar_cuando:
      - "Se necesita optimizacion iterativa de metricas"
      - "Se hace investigacion experimental autonoma"
    requiere_confirmacion: true

  loop-builder:
    nombre: "Loop Builder"
    categoria: "AI/Agentes"
    trigger: "/loop-builder"
    capabilities:
      - Entrevista guiada para disenar loops autonomos (5 rondas de preguntas)
      - Scaffold de loops/<nombre>/README.md con el contrato del loop (Goal, Boundaries, SOP, State, Logs)
      - Seleccion de trigger (for-loop continuo, cron, event-based, combo con gate script)
      - Gate scripts para despertar al agente solo con trabajo real
      - Tiers de evidencia del verifier y reglas via-negativa
      - Sesiones evolve cada 5-10 runs para mejorar el loop mismo
      - Diagramas originales del video + videos Remotion de flujo de datos
    activar_cuando:
      - "Se quiere un agente recurrente que trabaje solo"
      - "Se disena un loop nuevo con contrato y guardrails"
    requiere_confirmacion: true

